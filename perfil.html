<!DOCTYPE html>
<html lang="es">
<head>

    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <header>
        <a href="index.html" class="logo">
            <img src="img/logo.svg" alt="TechZone" class="logo-img">
            TechZone
        </a>
        <nav>
            <a href="index.html">Inicio</a>
            <a href="nosotros.html">Nosotros</a>
            <a href="productos.html">Productos</a>
            <a href="registro.html">Registro</a>
            <a href="login.html">Login</a>
            <a href="perfil.html" class="activo">Perfil</a>
        </nav>
    </header>

    <section>
        <div class="perfil-envoltura" id="perfil-datos">

            <div class="perfil-cabecera">
                <div class="perfil-icono" id="perfil-iniciales">--</div>
                <div>
                    <h3 id="perfil-nombre">Cliente TechZone</h3>
                    <span class="estado">Cuenta activa</span>
                </div>
            </div>

            <div class="informacion">
                <div class="fila-info">
                    <span class="campo-nombre">Correo electrónico</span>
                    <span class="campo-valor" id="perfil-correo">—</span>
                </div>
                <div class="fila-info">
                    <span class="campo-nombre">Teléfono</span>
                    <span class="campo-valor">No registrado</span>
                </div>
                <div class="fila-info">
                    <span class="campo-nombre">Dirección de envío</span>
                    <span class="campo-valor">No registrada</span>
                </div>
                <div class="fila-info">
                    <span class="campo-nombre">Cliente desde</span>
                    <span class="campo-valor">Hoy</span>
                </div>
            </div>

            <div class="perfil-acciones">
                <button class="boton boton-contorno">Editar datos</button>
                <button class="boton boton-texto" id="boton-cerrar-sesion">Cerrar sesión</button>
            </div>

        </div>
    </section>

    <footer>
        <div class="footer-envoltura">
            <div class="footer-marca">
                <img src="img/logo.svg" alt="">
                TechZone
            </div>
            <div class="footer-redes">
                <a href="#" class="red-social" aria-label="Instagram">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.2" cy="6.8" r="1"/></svg>
                </a>
                <a href="#" class="red-social" aria-label="Facebook">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M14 8.5h2.5V5H14c-2 0-3.5 1.6-3.5 3.5V11H8v3.5h2.5V21H14v-6.5h2.7l.5-3.5h-3.2V8.9c0-.4.3-.4.5-.4Z"/></svg>

            </div>
        </div>
        <p class="footer-copy">© 2026 TechZone — Tienda de dispositivos electrónicos</p>
    </footer>

    <script src="js/main.js"></script>

</html>
