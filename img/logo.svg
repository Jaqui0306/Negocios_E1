<svg viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="TechZone" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="tzBolt" x1="10%" y1="0%" x2="90%" y2="100%">
      <stop offset="0%" stop-color="#C8FF4D"/>
      <stop offset="100%" stop-color="#31E1C9"/>
    </linearGradient>
    <filter id="tzGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="1.1" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- chip base -->
  <rect x="1" y="1" width="38" height="38" rx="8" fill="#14171C"/>
  <rect x="1" y="1" width="38" height="38" rx="8" fill="none" stroke="#2B3038" stroke-width="1"/>

  <!-- circuit pins, same language as the hero illustration -->
  <g stroke="#5B6472" stroke-width="1.4" stroke-linecap="round">
    <line x1="12" y1="1" x2="12" y2="6"/>
    <line x1="28" y1="1" x2="28" y2="6"/>
    <line x1="12" y1="34" x2="12" y2="39"/>
    <line x1="28" y1="34" x2="28" y2="39"/>
  </g>

  <!-- Z / bolt mark -->
  <path d="M12 12 H27 L18 20 H27 L13 29 L16.5 21 H10 Z"
        fill="url(#tzBolt)" filter="url(#tzGlow)"/>
</svg>
